name: Stable Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Build Metadata
        id: build_meta
        shell: bash
        run: |
          CODENAME=$(sed -n 's/^[[:space:]]*appCodename[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -n 1 | tr -d '\r')
          if [ -z "$CODENAME" ]; then
            CODENAME="Unassigned"
          fi
          VERSION_PREFIX="$(TZ=Asia/Shanghai date +'%y').$(TZ=Asia/Shanghai date +'%-m')"
          echo "codename=$CODENAME" >> $GITHUB_OUTPUT
          echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check signing credentials
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are incomplete. Building release with the Gradle debug key and original applicationId; no formal release is published."
          fi

      - name: Build Stable Package
        if: steps.signing.outputs.has_signing == 'true'
        run: ./gradlew assembleRelease -PversionPrefix="${{ steps.build_meta.outputs.version_prefix }}" -PversionChannel=Stable -PappCodename="${{ steps.build_meta.outputs.codename }}"

      - name: Sign Release APK
        if: steps.signing.outputs.has_signing == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT
          test -s release.keystore

          STD_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-signed.apk" | head -n 1)
          ${ANDROID_HOME}/build-tools/37.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$STD_APK"

      - name: Generate MD5 Checksum
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          (cd app/build/outputs/apk/release/ && md5sum app-release-signed.apk > app-release-signed.apk.md5)

      - name: Upload Stable Signed Artifact
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Capsulyric-Stable-Signed
          path: |
            app/build/outputs/apk/release/app-release-signed.apk
            app/build/outputs/apk/release/app-release-signed.apk.md5

      # No custom signing secrets: release uses Gradle's debug signingConfig
      # without debug's applicationIdSuffix. Keep the regular application ID.
      - name: Build release APK with debug key (no signing secrets)
        if: steps.signing.outputs.has_signing != 'true'
        run: ./gradlew assembleRelease -PversionPrefix="${{ steps.build_meta.outputs.version_prefix }}" -PversionChannel=Stable -PappCodename="${{ steps.build_meta.outputs.codename }}"

      - name: Verify release APK signature and package
        if: steps.signing.outputs.has_signing != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.franco.capsulyric'"

      - name: Upload release APK (debug key, original package)
        if: steps.signing.outputs.has_signing != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Capsulyric-Stable-DebugKey-OriginalPackage
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk
